aid: motorway
name: Motorway
description: 'Motorway is the UK''s fastest-growing used car marketplace, connecting private
  sellers with a network of more than 8,000 verified car dealers through a daily online
  auction. Founded in 2017 and headquartered in London and Brighton, the platform provides
  instant AI-assisted vehicle valuations, a mobile app that builds a sale-ready car profile,
  nationwide home collection, same-day payment (Motorway Pay), transport (Motorway Move),
  and outstanding-finance handling. Over one million people have used Motorway to sell a
  car. It is a consumer and dealer (B2C/B2B) marketplace rather than a public API provider:
  no developer portal, OpenAPI, or public API surface is published as of this enrichment
  pass. Backed by Index Ventures, ICONIQ Growth, BMW i Ventures and LocalGlobe.'
